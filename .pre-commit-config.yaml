repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff — lint
        entry: uv run --directory backend --locked ruff check .
        language: unsupported
        pass_filenames: false
        always_run: true

      - id: ruff-format
        name: Ruff — formatting
        entry: uv run --directory backend --locked ruff format .
        language: unsupported
        pass_filenames: false
        always_run: true

      - id: basedpyright
        name: BasedPyright — types
        entry: uv run --directory backend --locked basedpyright
        language: unsupported
        pass_filenames: false
        always_run: true

      - id: pytest
        name: Pytest — tests
        entry: uv run --directory backend --locked python -m pytest -q
        language: unsupported
        pass_filenames: false
        always_run: true

      - id: frontend-format
        name: Frontend — formatting
        entry: pnpm --dir frontend run format
        language: unsupported
        pass_filenames: false
        always_run: true

      - id: frontend-lint
        name: Frontend — lint
        entry: pnpm --dir frontend run lint
        language: unsupported
        pass_filenames: false
        always_run: true

      - id: frontend-types
        name: Frontend — types
        entry: pnpm --dir frontend run typecheck
        language: unsupported
        pass_filenames: false
        always_run: true